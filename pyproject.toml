[project]
name = "agent-builder"
version = "0.1.0"
description = ""
authors = [
    {name = "Caglan Akpinar",email = "cakpinar23@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = "^3.10"
dependencies = [
    "pyyaml (>=6.0.3,<7.0.0)",
    "anthropic (>=0.120.2,<0.121.0)",
    "openai (>=2.52.0,<3.0.0)",
    "google-genai (>=2.16.0,<3.0.0)",
    "huggingface-hub (>=1.26.0,<2.0.0)",
    "mistralai (>=2.8.0,<3.0.0)",
    "torch (>=2.13.0,<3.0.0)",
    "transformers (>=5.14.1,<6.0.0)"
]

# Database drivers are optional: db_connector imports them lazily, so you only install the engines you
# actually use, e.g. `poetry install --extras "postgres chroma"` or `--extras all`.
[project.optional-dependencies]
# db_connector/tabular.py
postgres = ["psycopg2-binary (>=2.9.0,<3.0.0)"]
mysql = ["pymysql (>=1.1.0,<2.0.0)"]
bigquery = ["google-cloud-bigquery (>=3.0.0,<4.0.0)"]
snowflake = ["snowflake-connector-python (>=3.0.0,<4.0.0)"]
duckdb = ["duckdb (>=1.0.0,<2.0.0)"]
# db_connector/vector.py
faiss = ["faiss-cpu (>=1.8.0,<2.0.0)", "numpy (>=1.26.0,<3.0.0)"]
chroma = ["chromadb (>=1.0.0,<2.0.0)"]
qdrant = ["qdrant-client (>=1.9.0,<2.0.0)"]
pinecone = ["pinecone (>=9.0.0,<10.0.0)"]
weaviate = ["weaviate-client (>=4.22.0,<5.0.0)"]
milvus = ["pymilvus (>=3.0.0,<4.0.0)"]
lancedb = ["lancedb (>=0.36.0,<1.0.0)"]
# db_connector/text.py
elasticsearch = ["elasticsearch (>=8.0.0,<10.0.0)"]
opensearch = ["opensearch-py (>=2.4.0,<4.0.0)"]
meilisearch = ["meilisearch (>=0.31.0,<1.0.0)"]
typesense = ["typesense (>=0.21.0,<2.0.0)"]
all = [
    "psycopg2-binary (>=2.9.0,<3.0.0)",
    "pymysql (>=1.1.0,<2.0.0)",
    "google-cloud-bigquery (>=3.0.0,<4.0.0)",
    "snowflake-connector-python (>=3.0.0,<4.0.0)",
    "duckdb (>=1.0.0,<2.0.0)",
    "faiss-cpu (>=1.8.0,<2.0.0)",
    "numpy (>=1.26.0,<3.0.0)",
    "chromadb (>=1.0.0,<2.0.0)",
    "qdrant-client (>=1.9.0,<2.0.0)",
    "pinecone (>=9.0.0,<10.0.0)",
    "weaviate-client (>=4.22.0,<5.0.0)",
    "pymilvus (>=3.0.0,<4.0.0)",
    "lancedb (>=0.36.0,<1.0.0)",
    "elasticsearch (>=8.0.0,<10.0.0)",
    "opensearch-py (>=2.4.0,<4.0.0)",
    "meilisearch (>=0.31.0,<1.0.0)",
    "typesense (>=0.21.0,<2.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
